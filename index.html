<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- מתאים את העמוד לרוחב המסך בטלפון ובטאבלט -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Process</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- עמוד "process": יומן של שלבי העבודה על האתר -->
  <main class="process-page">

    <!-- כותרת ענקית בראש העמוד -->
    <h1 class="process-title">process</h1>

    <!-- עדכון 1: עמוד ה-Coming Soon -->
    <section class="update">
      <h2 class="update-title">19.10 ----- Uploaded my Coming Soon page</h2>
      <img class="coming-soon-image" src="images/coming-soon-page.png" alt="The Coming Soon page: the words COMING SOON on a white background">
    </section>

    <!-- עדכון 2: שני כיווני עיצוב, #A ו-#B -->
    <section class="update">
      <h2 class="update-title update-title-second">26.10 ----- Two visual directions</h2>

      <div class="directions">
        <!-- כיוון A: רקע לבן -->
        <figure class="direction">
          <figcaption class="direction-label">#A</figcaption>
          <div class="direction-image-frame direction-image-frame-a">
            <img class="direction-image direction-image-a" src="images/visual-directions.png" alt="Direction A: a white layout with a project list on the right">
          </div>
        </figure>

        <!-- כיוון B: רקע שחור עם מסגרת אדומה -->
        <figure class="direction">
          <figcaption class="direction-label">#B</figcaption>
          <div class="direction-image-frame direction-image-frame-b">
            <img class="direction-image direction-image-b" src="images/visual-directions.png" alt="Direction B: a dark layout with a red frame around the project">
          </div>
        </figure>
      </div>

      <p class="update-note">I chose to create a new direction</p>
    </section>

  </main>

</body>
</html>
